name: NuGet Pack

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to NuGet.org'
        required: false
        type: boolean
        default: false
      version:
        description: 'Release version to publish (required when publish is true outside a v* tag)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-native-x64:
    name: Build Native (linux-x64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            scons

      - name: Build AeonVoice native libraries
        run: scons -j"$(nproc)"

      - name: Stage native runtime assets
        run: ./dotnet/scripts/stage-native.sh "linux-x64" ./build/linux

      - name: Upload native runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: dotnet/AeonVoice.Native/runtimes/linux-x64/native/*
          if-no-files-found: error

  build-native-arm64:
    name: Build Native (linux-arm64, bullseye baseline)
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:11

    steps:
      - name: Install checkout prerequisites
        run: |
          # Bullseye has moved to the Debian archive; keep this job on the
          # intended glibc baseline instead of silently moving its build
          # environment to a newer distribution.
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/bullseye-updates/d' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            pkg-config \
            scons

      - name: Build AeonVoice native libraries
        run: scons -j"$(nproc)"

      - name: Stage native runtime assets
        run: ./dotnet/scripts/stage-native.sh "linux-arm64" ./build/linux

      - name: Upload native runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: dotnet/AeonVoice.Native/runtimes/linux-arm64/native/*
          if-no-files-found: error

  pack:
    name: Pack NuGet Packages
    runs-on: ubuntu-24.04
    needs:
      - build-native-x64
      - build-native-arm64

    outputs:
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Build with the current LTS SDK while retaining the net8.0 runtime
          # required by the framework-dependent package-consumer smoke test.
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Download linux-x64 native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: dotnet/AeonVoice.Native/runtimes/linux-x64/native

      - name: Download linux-arm64 native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: dotnet/AeonVoice.Native/runtimes/linux-arm64/native

      - name: Resolve package version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            v="${MANUAL_VERSION}"
            if [[ -z "${v}" ]]; then
              echo "::error::A release version is required when manually publishing."
              exit 1
            fi
          else
            v="0.2.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "${v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Package version '${v}' is not a valid SemVer 2 version."
            exit 1
          fi
          echo "package_version=$v" >> "$GITHUB_OUTPUT"
          echo "Using version: $v"

      - name: Pack native package
        run: |
          dotnet pack dotnet/AeonVoice.Native/AeonVoice.Native.csproj \
            -c Release \
            -o ./artifacts/nupkgs \
            /p:Version=${{ steps.version.outputs.package_version }}

      - name: Pack managed package
        run: |
          dotnet pack dotnet/AeonVoice/AeonVoice.csproj \
            -c Release \
            -o ./artifacts/nupkgs \
            /p:Version=${{ steps.version.outputs.package_version }}

      - name: Smoke test packaged managed runtime (linux-x64)
        shell: bash
        run: |
          dotnet restore dotnet/samples/AeonVoice.SmokeTest/AeonVoice.SmokeTest.csproj \
            --source "${GITHUB_WORKSPACE}/artifacts/nupkgs" \
            --source "https://api.nuget.org/v3/index.json" \
            /p:AeonVoiceVersion=${{ steps.version.outputs.package_version }} \
            /p:RuntimeIdentifier=linux-x64
          dotnet run --project dotnet/samples/AeonVoice.SmokeTest/AeonVoice.SmokeTest.csproj \
            -c Release \
            --no-restore \
            --runtime linux-x64 \
            /p:AeonVoiceVersion=${{ steps.version.outputs.package_version }}

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ steps.version.outputs.package_version }}
          path: artifacts/nupkgs/*.nupkg
          if-no-files-found: error

  smoke-arm64:
    name: Smoke Test Packaged Runtime (linux-arm64)
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:11
    needs: pack

    steps:
      - name: Install checkout prerequisites
        run: |
          # See the matching ARM64 build job above: retain the Bullseye
          # baseline through Debian's archive after its regular endpoints age out.
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/bullseye-updates/d' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # The smoke sample targets net8.0, so install its runtime alongside
          # the current LTS SDK used to restore and build it.
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Download packed NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs-${{ needs.pack.outputs.package_version }}
          path: artifacts/nupkgs

      - name: Smoke test packaged managed runtime
        shell: bash
        run: |
          dotnet restore dotnet/samples/AeonVoice.SmokeTest/AeonVoice.SmokeTest.csproj \
            --source "${GITHUB_WORKSPACE}/artifacts/nupkgs" \
            --source "https://api.nuget.org/v3/index.json" \
            /p:AeonVoiceVersion=${{ needs.pack.outputs.package_version }} \
            /p:RuntimeIdentifier=linux-arm64
          dotnet run --project dotnet/samples/AeonVoice.SmokeTest/AeonVoice.SmokeTest.csproj \
            -c Release \
            --no-restore \
            --runtime linux-arm64 \
            /p:AeonVoiceVersion=${{ needs.pack.outputs.package_version }}

  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-24.04
    needs:
      - pack
      - smoke-arm64
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate Trusted Publishing settings
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          set -euo pipefail

          missing=0
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::Missing required secret: NUGET_USER (NuGet profile name for Trusted Publishing login)."
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Publish is blocked until required secrets are configured."
            exit 1
          fi

      - name: Download packed artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs-${{ needs.pack.outputs.package_version }}
          path: artifacts/nupkgs

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (OIDC)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        run: |
          dotnet nuget push artifacts/nupkgs/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
